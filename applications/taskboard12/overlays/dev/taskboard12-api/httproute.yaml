apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard12-api
  labels:
    app: taskboard12-api
    app.kubernetes.io/name: taskboard12-api
    app.kubernetes.io/part-of: taskboard12
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard12-api.taskboard12-dev.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard12-api
      port: 80
