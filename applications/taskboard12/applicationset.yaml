apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taskboard12-dev
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: taskboard12-api
      - name: taskboard12-web
  template:
    metadata:
      name: '{{name}}-dev'
    spec:
      project: default
      source:
        repoURL: https://github.com/ika100-demo/taskboard12-gitops
        targetRevision: main
        path: applications/taskboard12/overlays/dev/{{name}}
      destination:
        server: https://kubernetes.default.svc
        namespace: taskboard12-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
---
